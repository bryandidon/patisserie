      <p class="liens__accroche">Créations de saison · Guadeloupe</p>
    </header>

    <nav class="liens__liste" aria-label="Nos liens">
      <!-- TODO : décommenter et remplacer # par le lien de l'application de commande
      <a class="lien lien--plein" href="#">
        <svg class="lien__icone" aria-hidden="true"><use href="#i-sac"/></svg>
        <span class="lien__texte">Commander en Click &amp; Collect</span>
        <svg class="lien__chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </a>
      -->
      <a class="lien" href="https://www.bryandidon.fr/">

        <svg class="lien__chevron" aria-hidden="true"><use href="#i-chevron"/></svg>

      <a class="lien" href="#" target="_blank" rel="noopener">
        <svg class="lien__icone" aria-hidden="true"><use href="#i-facebook"/></svg>
        <span class="lien__texte">Facebook</span>
        <svg class="lien__chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </a>

    <footer class="liens__pied">
